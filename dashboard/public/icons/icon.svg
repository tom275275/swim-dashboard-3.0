<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.5"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="192" height="192" rx="38" ry="38" fill="url(#bg)"/>

  <!-- Swimmer body (simplified side-on figure) -->
  <!-- Head -->
  <circle cx="130" cy="72" r="14" fill="#ffffff"/>
  <!-- Body / torso horizontal (swimming pose) -->
  <rect x="58" y="84" width="64" height="14" rx="7" fill="#ffffff"/>
  <!-- Arm extended forward -->
  <rect x="112" y="84" width="40" height="10" rx="5" fill="#ffffff" transform="rotate(-12 132 89)"/>
  <!-- Arm trailing back -->
  <rect x="44" y="88" width="32" height="9" rx="4.5" fill="#e0f2fe" transform="rotate(10 60 92)"/>
  <!-- Legs kick -->
  <rect x="44" y="96" width="36" height="9" rx="4.5" fill="#ffffff" transform="rotate(-14 62 100)"/>
  <rect x="44" y="84" width="34" height="9" rx="4.5" fill="#e0f2fe" transform="rotate(16 61 88)"/>

  <!-- Wave lines at bottom -->
  <path d="M20 140 Q44 128 68 140 Q92 152 116 140 Q140 128 164 140 Q176 146 192 140 L192 165 Q176 159 164 165 Q140 177 116 165 Q92 153 68 165 Q44 177 20 165 Q8 159 0 165 L0 140 Q8 134 20 140Z" fill="url(#wave)"/>
  <path d="M0 158 Q24 146 48 158 Q72 170 96 158 Q120 146 144 158 Q168 170 192 158 L192 192 L0 192Z" fill="rgba(255,255,255,0.18)"/>
</svg>
